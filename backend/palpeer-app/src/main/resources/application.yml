spring:
  application:
    name: palpeer-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:palpeer}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:palpeer}
    password: ${DB_PASSWORD:palpeer}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: palpeer-hikari
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      auto-commit: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:12MB}
  mail:
    host: ${PALPEER_SMTP_HOST:smtp-pulse.com}
    port: ${PALPEER_SMTP_PORT:587}
    username: ${PALPEER_SMTP_USERNAME:}
    password: ${PALPEER_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          # Port 587: STARTTLS. Set PALPEER_SMTP_SSL=true (default) for encrypted submit.
          starttls:
            enable: ${PALPEER_SMTP_SSL:true}
            required: ${PALPEER_SMTP_SSL:true}
          ssl:
            enable: false
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000

server:
  # Render injects PORT; local/dev use SERVER_PORT (e.g. 8085).
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,db
  health:
    # Redis not used by domain code yet — do not fail health when Redis is down
    redis:
      enabled: false
    # SMTP often blocked/slow on Render free — keep /actuator/health green without blocking probes
    mail:
      enabled: false
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

palpeer:
  api:
    version: v1
  fcm:
    # Firebase Cloud Messaging via Admin SDK. When false (or credentials missing), pushes are logged only.
    enabled: ${PALPEER_FCM_ENABLED:false}
    # Path to Firebase service-account JSON (local/dev). Ignored if credentials-json is set.
    credentials-file: ${PALPEER_FCM_CREDENTIALS_FILE:}
    # Inline service-account JSON (preferred on PaaS). Takes precedence over credentials-file.
    credentials-json: ${PALPEER_FCM_CREDENTIALS_JSON:}
  mail:
    # auto | sendpulse | smtp — auto uses SendPulse REST when client-id/secret are set.
    # From must be on a SendPulse-authenticated domain (palpeer.com). Reply-To = monitored inbox.
    # See docs/mail-deliverability.md
    provider: ${PALPEER_MAIL_PROVIDER:auto}
    from: ${PALPEER_MAIL_FROM:noreply@palpeer.com}
    from-name: ${PALPEER_MAIL_FROM_NAME:Palpeer}
    header-from: ${PALPEER_MAIL_HEADER_FROM:support@palpeer.com}
    sendpulse:
      # Force-on even with provider=auto; still needs client-id + client-secret.
      enabled: ${PALPEER_SENDPULSE_ENABLED:false}
      # Prefer dedicated API credentials; fall back to SMTP username/password (SendPulse account login).
      client-id: ${PALPEER_SENDPULSE_CLIENT_ID:${PALPEER_SMTP_USERNAME:}}
      client-secret: ${PALPEER_SENDPULSE_CLIENT_SECRET:${PALPEER_SMTP_PASSWORD:}}
      base-url: ${PALPEER_SENDPULSE_BASE_URL:https://api.sendpulse.com}
  sms:
    # Enable exactly one live provider at a time (telnyx | twilio | bulksms).
    bulksms:
      # JSON REST API. Legacy EAPI is deprecated by BulkSMS.
      # Docs: https://www.bulksms.com/developer/json/v1/
      enabled: ${BULKSMS_ENABLED:false}
      token-id: ${BULKSMS_TOKEN_ID:}
      token-secret: ${BULKSMS_TOKEN_SECRET:}
      base-url: ${BULKSMS_BASE_URL:https://api.bulksms.com/v1}
      sender: ${BULKSMS_SENDER:Palpeer}
      timeout-ms: ${BULKSMS_TIMEOUT_MS:15000}
    twilio:
      # Docs: https://www.twilio.com/docs/messaging/api
      # Prefer API Key SID/Secret for auth; Account SID is still required in the API path.
      # Requires TWILIO_FROM_NUMBER or TWILIO_MESSAGING_SERVICE_SID.
      enabled: ${TWILIO_ENABLED:false}
      account-sid: ${TWILIO_ACCOUNT_SID:}
      api-key-sid: ${TWILIO_API_KEY_SID:}
      api-key-secret: ${TWILIO_API_KEY_SECRET:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
      messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
      friendly-name: ${TWILIO_FRIENDLY_NAME:}
      timeout-ms: ${TWILIO_TIMEOUT_MS:15000}
    telnyx:
      # Docs: https://developers.telnyx.com/docs/api/v2/messaging
      enabled: ${TELNYX_ENABLED:false}
      api-key: ${TELNYX_API_KEY:}
      base-url: ${TELNYX_API_URL:https://api.telnyx.com/v2}
      messaging-profile-id: ${TELNYX_MESSAGING_PROFILE_ID:}
      from-number: ${TELNYX_FROM_NUMBER:}
      timeout-ms: ${TELNYX_TIMEOUT_MS:15000}
  storage:
    local:
      root: ${PALPEER_STORAGE_ROOT:./data/private-storage}
  exchange:
    quote-ttl: ${EXCHANGE_QUOTE_TTL:60s}
  p2p:
    # How often OPEN requests past expiresAt are marked EXPIRED (their negotiations close too)
    expiry-sweep-ms: ${P2P_EXPIRY_SWEEP_MS:30000}
  admin:
    # If set and no enabled admin exists, grants SUPER_ADMIN to this user email on startup (P15-03)
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
  cors:
    # Comma-separated browser origins allowed to call the API (Admin-End Vite, etc.)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:8081,http://127.0.0.1:8081}
  security:
    # Origin used in emailed security links (no trailing slash).
    public-base-url: ${PUBLIC_API_BASE_URL:http://localhost:8085}
    suspend-token-ttl: ${SUSPEND_TOKEN_TTL:24h}
    jwt:
      secret: ${JWT_SECRET:CHANGE_ME_PALPEER_DEV_JWT_SECRET_AT_LEAST_32_CHARS}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:14d}
      refresh-token-ttl-remembered: ${JWT_REFRESH_TTL_REMEMBERED:30d}
      issuer: palpeer
    otp:
      length: ${OTP_LENGTH:6}
      ttl: ${OTP_TTL:10m}
      max-attempts: ${OTP_MAX_ATTEMPTS:5}
      log-code: ${OTP_LOG_CODE:false}
    google:
      # Comma-separated OAuth 2.0 client IDs (Web + Android + iOS). Empty disables Google Sign-In.
      client-ids: ${GOOGLE_CLIENT_IDS:}
  complycube:
    enabled: ${COMPLYCUBE_ENABLED:false}
    api-key: ${COMPLYCUBE_API_KEY:}
    base-url: ${COMPLYCUBE_BASE_URL:https://api.complycube.com/v1}
    webhook-secret: ${COMPLYCUBE_WEBHOOK_SECRET:}
  apaylo:
    enabled: ${APAYLO_ENABLED:false}
    sandbox: ${APAYLO_SANDBOX:false}
    # false = CAD funding stays PENDING with Instant Interac details until webhook settles.
    auto-sandbox-settle: ${APAYLO_AUTO_SANDBOX_SETTLE:false}
    offline-sandbox-settle: ${APAYLO_OFFLINE_SANDBOX_SETTLE:true}
    api-key: ${APAYLO_API_KEY:}
    shared-key: ${APAYLO_SHARED_KEY:}
    # env2 hosts are documented as host/host/api; method paths are /Merchant/... or /EFT/...
    base-url: ${APAYLO_BASE_URL:https://api.etransfer.apaylo.com/api.apaylo.com/api}
    sandbox-base-url: ${APAYLO_SANDBOX_BASE_URL:https://sandboxapi.apaylo.com/sandboxapi.apaylo.com/api}
    account-id: ${APAYLO_ACCOUNT_ID:}
    apl-reference: ${APAYLO_APL_REFERENCE:}
    create-searchable-etransfer-path: ${APAYLO_CREATE_SEARCHABLE_PATH:/Merchant/RequestInteracEtransferLink}
    send-interac-etransfer-path: ${APAYLO_SEND_INTERAC_PATH:/Merchant/SendInteracEtransfer}
    send-eft-path: ${APAYLO_SEND_EFT_PATH:/EFT/CreateEFTTransaction}
    interac-security-question: ${APAYLO_INTERAC_SECURITY_QUESTION:What is the name of this transfer?}
    interac-security-answer: ${APAYLO_INTERAC_SECURITY_ANSWER:PALPEER}
    account-balance-path: ${APAYLO_ACCOUNT_BALANCE_PATH:/Merchant/GetBalance}
    webhook-secret: ${APAYLO_WEBHOOK_SECRET:}
    webhook-signature-header: ${APAYLO_WEBHOOK_SIGNATURE_HEADER:X-Webhook-Signature}
  kuda:
    enabled: ${KUDA_ENABLED:false}
    sandbox: ${KUDA_SANDBOX:true}
    # false = funding stays PENDING with VA details until webhook (real payment process).
    auto-sandbox-settle: ${KUDA_AUTO_SANDBOX_SETTLE:false}
    offline-sandbox-settle: ${KUDA_OFFLINE_SANDBOX_SETTLE:true}
    # true skips customer transfer (FUND_VIRTUAL_ACCOUNT demo). Leave false for real funding UX.
    demo-fund-enabled: ${KUDA_DEMO_FUND_ENABLED:false}
    email: ${KUDA_EMAIL:}
    api-key: ${KUDA_API_KEY:}
    base-url: ${KUDA_BASE_URL:}
    sender-name: ${KUDA_SENDER_NAME:PALPEER}
    webhook-username: ${KUDA_WEBHOOK_USERNAME:}
    webhook-password: ${KUDA_WEBHOOK_PASSWORD:}
    webhook-secret: ${KUDA_WEBHOOK_SECRET:}
    webhook-signature-header: ${KUDA_WEBHOOK_SIGNATURE_HEADER:X-Webhook-Signature}
  korapay:
    enabled: ${KORAPAY_ENABLED:false}
    sandbox: ${KORAPAY_SANDBOX:true}
    auto-sandbox-credit: ${KORAPAY_AUTO_SANDBOX_CREDIT:true}
    offline-sandbox-settle: ${KORAPAY_OFFLINE_SANDBOX_SETTLE:true}
    auto-sandbox-settle: ${KORAPAY_AUTO_SANDBOX_SETTLE:true}
    public-key: ${KORAPAY_PUBLIC_KEY:}
    secret-key: ${KORAPAY_SECRET_KEY:}
    base-url: ${KORAPAY_BASE_URL:https://api.korapay.com}
    bank-transfer-path: ${KORAPAY_BANK_TRANSFER_PATH:/merchant/api/v1/charges/bank-transfer}
    sandbox-credit-path: ${KORAPAY_SANDBOX_CREDIT_PATH:/merchant/api/v1/virtual-bank-account/sandbox/credit}
    charge-query-path: ${KORAPAY_CHARGE_QUERY_PATH:/merchant/api/v1/charges}
    disburse-path: ${KORAPAY_DISBURSE_PATH:/merchant/api/v1/transactions/disburse}
    transaction-query-path: ${KORAPAY_TRANSACTION_QUERY_PATH:/merchant/api/v1/transactions}
    banks-path: ${KORAPAY_BANKS_PATH:/merchant/api/v1/misc/banks}
    balances-path: ${KORAPAY_BALANCES_PATH:/merchant/api/v1/balances}
    webhook-secret: ${KORAPAY_WEBHOOK_SECRET:}
    webhook-signature-header: ${KORAPAY_WEBHOOK_SIGNATURE_HEADER:x-korapay-signature}

logging:
  level:
    root: INFO
    com.palpeer: INFO
