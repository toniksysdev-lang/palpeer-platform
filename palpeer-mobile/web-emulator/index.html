<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PALPEER — Mobile Preview</title>
    <style>
      :root {
        --bezel: #111418;
        --bezel-edge: #2a3038;
        --screen: #ffffff;
        --desk: #e8ece9;
        --ink: #1b2420;
        --muted: #63706a;
        --brand: #0e9f6e;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
        background:
          radial-gradient(1200px 600px at 50% -10%, #d7efe4 0%, transparent 55%),
          linear-gradient(180deg, #f4f7f5 0%, var(--desk) 100%);
        color: var(--ink);
      }

      .page {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(220px, 280px) 1fr;
        gap: 24px;
        padding: 28px;
      }

      .panel {
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid #d2d9d5;
        border-radius: 20px;
        padding: 20px;
        backdrop-filter: blur(8px);
        height: fit-content;
        position: sticky;
        top: 28px;
      }

      .panel h1 {
        margin: 0 0 4px;
        font-size: 20px;
        letter-spacing: -0.02em;
      }

      .panel p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      label {
        display: block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 14px 0 8px;
      }

      .devices {
        display: grid;
        gap: 8px;
      }

      .devices button {
        appearance: none;
        border: 1px solid #d2d9d5;
        background: #fff;
        border-radius: 12px;
        padding: 10px 12px;
        text-align: left;
        cursor: pointer;
        font: inherit;
        color: var(--ink);
      }

      .devices button.active {
        border-color: var(--brand);
        box-shadow: 0 0 0 2px rgba(14, 159, 110, 0.18);
      }

      .devices button span {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }

      .links {
        display: grid;
        gap: 8px;
        margin-top: 18px;
      }

      .links a {
        color: var(--brand);
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
      }

      .stage {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 56px);
      }

      .phone {
        position: relative;
        width: var(--w);
        height: var(--h);
        padding: 12px;
        border-radius: 44px;
        background: linear-gradient(160deg, var(--bezel-edge), var(--bezel));
        box-shadow:
          0 30px 80px rgba(7, 20, 15, 0.28),
          inset 0 0 0 2px rgba(255, 255, 255, 0.08);
      }

      .phone::before {
        content: '';
        position: absolute;
        top: 22px;
        left: 50%;
        transform: translateX(-50%);
        width: 108px;
        height: 28px;
        border-radius: 20px;
        background: #0a0c0e;
        z-index: 2;
      }

      .screen-wrap {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 34px;
        overflow: hidden;
        background: var(--screen);
      }

      .screen {
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 34px;
        background: transparent;
        overflow: hidden;
        display: block;
        position: relative;
        z-index: 1;
      }

      /* Match BrandSplash until the Expo iframe paints (no instructional copy). */
      .screen-boot {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 24px;
        background: #ffffff;
        pointer-events: none;
        transition: opacity 140ms ease-out;
      }

      .screen-boot.is-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .screen-boot img {
        width: 200px;
        height: 84px;
        object-fit: contain;
      }

      .screen-boot .track {
        width: 148px;
        height: 4px;
        border-radius: 999px;
        background: #f4f6f5;
        overflow: hidden;
        margin-top: 4px;
      }

      .screen-boot .fill {
        height: 100%;
        width: 28%;
        border-radius: 999px;
        background: #0e9f6e;
        animation: preview-boot-bar 1.6s ease-in-out infinite alternate;
      }

      @keyframes preview-boot-bar {
        from {
          transform: translateX(0);
          width: 28%;
        }
        to {
          transform: translateX(160%);
          width: 55%;
        }
      }

      .side-btn {
        position: absolute;
        right: -3px;
        width: 3px;
        background: #3a414a;
        border-radius: 2px;
      }

      .side-btn.power {
        top: 140px;
        height: 64px;
      }

      .side-btn.vol-up {
        left: -3px;
        right: auto;
        top: 120px;
        height: 42px;
      }

      .side-btn.vol-down {
        left: -3px;
        right: auto;
        top: 172px;
        height: 42px;
      }

      @media (max-width: 900px) {
        .page {
          grid-template-columns: 1fr;
        }

        .panel {
          position: static;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <aside class="panel">
        <h1>PALPEER Preview</h1>
        <p>Web emulator for the Expo mobile app. Pick a device size, then use the live app in the frame.</p>

        <label>Device</label>
        <div class="devices" id="devices"></div>

        <div class="links">
          <a id="open-raw" href="http://localhost:8081" target="_blank" rel="noreferrer">Open raw Expo web</a>
          <a href="http://localhost:8085/swagger-ui.html" target="_blank" rel="noreferrer">Backend Swagger</a>
          <a href="http://localhost:5173" target="_blank" rel="noreferrer">Admin console</a>
        </div>

      </aside>

      <main class="stage">
        <div class="phone" id="phone">
          <span class="side-btn power"></span>
          <span class="side-btn vol-up"></span>
          <span class="side-btn vol-down"></span>
          <div class="screen-wrap">
            <div class="screen-boot" id="screen-boot" aria-hidden="true">
              <img src="/palpeer-logo.png" alt="" width="200" height="84" />
              <div class="track"><div class="fill"></div></div>
            </div>
            <!-- camera/microphone required for KYC capture inside this cross-origin Expo iframe -->
            <iframe
              class="screen"
              id="frame"
              title="PALPEER mobile"
              allow="camera *; microphone *; clipboard-read *; clipboard-write *"
              allowfullscreen
            ></iframe>
          </div>
        </div>
      </main>
    </div>

    <script>
      const APP_URL = new URLSearchParams(location.search).get('app') || 'http://localhost:8081';
      const devices = [
        { id: 'pixel8', name: 'Pixel 8', detail: '412 × 915', w: 412, h: 915 },
        { id: 'iphone15', name: 'iPhone 15', detail: '393 × 852', w: 393, h: 852 },
        { id: 'iphoneSE', name: 'iPhone SE', detail: '375 × 667', w: 375, h: 667 },
        { id: 'fold', name: 'Tall phone', detail: '360 × 800', w: 360, h: 800 },
      ];

      const phone = document.getElementById('phone');
      const frame = document.getElementById('frame');
      const boot = document.getElementById('screen-boot');
      const devicesEl = document.getElementById('devices');
      const openRaw = document.getElementById('open-raw');
      openRaw.href = APP_URL;

      function hideBoot() {
        if (!boot || boot.classList.contains('is-hidden')) return;
        boot.classList.add('is-hidden');
        window.setTimeout(() => boot.remove(), 180);
      }

      // Keep the branded overlay until Expo's BrandSplash mounts (avoids a white gap).
      window.addEventListener('message', (event) => {
        if (event?.data?.type === 'palpeer-brand-splash-ready') hideBoot();
      });
      // Fallback if postMessage never arrives (older build / blocked).
      window.setTimeout(hideBoot, 15_000);
      frame.src = APP_URL;

      function applyDevice(device) {
        phone.style.setProperty('--w', device.w + 'px');
        phone.style.setProperty('--h', device.h + 'px');
        localStorage.setItem('palpeer.preview.device', device.id);
        [...devicesEl.children].forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.id === device.id);
        });
      }

      devices.forEach((device) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.id = device.id;
        btn.innerHTML = `${device.name}<span>${device.detail}</span>`;
        btn.addEventListener('click', () => applyDevice(device));
        devicesEl.appendChild(btn);
      });

      const saved = localStorage.getItem('palpeer.preview.device');
      applyDevice(devices.find((d) => d.id === saved) || devices[0]);
    </script>
  </body>
</html>
