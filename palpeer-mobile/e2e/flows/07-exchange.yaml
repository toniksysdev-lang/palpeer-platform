appId: com.palpeer.app
name: 07 Currency exchange
tags: [critical, financial]
---
- runFlow: subflows/to-tabs.yaml
- tapOn:
    id: tab-wallets
- tapOn:
    id: wallet-card-CAD
- tapOn:
    id: wallet-exchange
- extendedWaitUntil:
    visible:
      id: exchange-send
    timeout: 20000
- assertVisible: 'CAD wallet'
- assertVisible: 'NGN wallet'

# More than the balance is blocked on the client (the backend still decides)
- runFlow:
    file: subflows/type.yaml
    env: { FIELD: exchange-send, TEXT: '500' }
- extendedWaitUntil:
    visible: 'You can exchange up to.*'
    timeout: 20000
- runFlow:
    file: subflows/type.yaml
    env: { FIELD: exchange-send, TEXT: '10' }

# The backend calculates the other side and the rate
- extendedWaitUntil:
    visible:
      id: exchange-rate
    timeout: 30000
- tapOn:
    id: exchange-continue
- extendedWaitUntil:
    visible:
      id: exchange-confirm
    timeout: 20000
- assertVisible:
    id: exchange-review-rate
- assertVisible:
    id: exchange-review-receive
- tapOn:
    id: exchange-confirm
- runFlow:
    file: subflows/enter-pin.yaml
    env:
      ENTRY: pin-prompt-entry
- extendedWaitUntil:
    visible: 'Exchange complete'
    timeout: 40000
- assertVisible:
    id: exchange-result-receive
- tapOn:
    id: exchange-result-done

# Balances come from the backend after the exchange
- runFlow: subflows/to-tabs.yaml
- tapOn:
    id: tab-wallets
- swipe:
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: wallet-available-CAD
      text: '.*90\.00.*'
    timeout: 30000
