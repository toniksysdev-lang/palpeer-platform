# Render Blueprint — Palpeer API, admin, Postgres, and Redis
# Dashboard: New → Blueprint → connect https://github.com/toniksysdev-lang/palpeer-platform
# Docs: docs/render-deploy.md

databases:
  - name: palpeer-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: palpeer-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # private (internal network only)

  - type: web
    name: palpeer-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Soft-fail when email fails; mobile autofills debugOtp. Prefer SendPulse REST on Render.
      - key: OTP_LOG_CODE
        value: "true"
      - key: PALPEER_MAIL_PROVIDER
        value: auto
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: palpeer-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: palpeer-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: palpeer-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: palpeer-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: palpeer-db
          property: password
      - key: DB_SSLMODE
        value: require
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: palpeer-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: palpeer-redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          type: keyvalue
          name: palpeer-redis
          property: password
      - key: REDIS_SSL
        value: "true"
      # Set these in the Render dashboard when the Blueprint prompts (sync: false)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # SendPulse REST (HTTPS) — Settings → API → Client credentials
      - key: PALPEER_SENDPULSE_CLIENT_ID
        sync: false
      - key: PALPEER_SENDPULSE_CLIENT_SECRET
        sync: false
      - key: PALPEER_SENDPULSE_ENABLED
        sync: false
      # SMTP fallback (usually blocked on Render free)
      - key: PALPEER_SMTP_HOST
        sync: false
      - key: PALPEER_SMTP_PORT
        sync: false
      - key: PALPEER_SMTP_USERNAME
        sync: false
      - key: PALPEER_SMTP_PASSWORD
        sync: false
      - key: PALPEER_SMTP_SSL
        sync: false
      - key: PALPEER_MAIL_FROM
        sync: false
      - key: PALPEER_MAIL_FROM_NAME
        sync: false
      - key: PALPEER_MAIL_HEADER_FROM
        sync: false
      # FCM — set enabled=true and paste service-account JSON
      - key: PALPEER_FCM_ENABLED
        sync: false
      - key: PALPEER_FCM_CREDENTIALS_JSON
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      # Payment rails — required for admin Pool Funds live balances + funding/withdrawals
      - key: APAYLO_ENABLED
        sync: false
      - key: APAYLO_SANDBOX
        sync: false
      - key: APAYLO_AUTO_SANDBOX_SETTLE
        sync: false
      - key: APAYLO_OFFLINE_SANDBOX_SETTLE
        sync: false
      - key: APAYLO_API_KEY
        sync: false
      - key: APAYLO_SHARED_KEY
        sync: false
      - key: APAYLO_ACCOUNT_ID
        sync: false
      - key: APAYLO_BASE_URL
        sync: false
      - key: APAYLO_SANDBOX_BASE_URL
        sync: false
      - key: APAYLO_ACCOUNT_BALANCE_PATH
        sync: false
      - key: APAYLO_WEBHOOK_SECRET
        sync: false
      - key: KORAPAY_ENABLED
        sync: false
      - key: KORAPAY_SANDBOX
        sync: false
      - key: KORAPAY_AUTO_SANDBOX_CREDIT
        sync: false
      - key: KORAPAY_AUTO_SANDBOX_SETTLE
        sync: false
      - key: KORAPAY_OFFLINE_SANDBOX_SETTLE
        sync: false
      - key: KORAPAY_PUBLIC_KEY
        sync: false
      - key: KORAPAY_SECRET_KEY
        sync: false
      - key: KORAPAY_BASE_URL
        sync: false
      - key: KORAPAY_WEBHOOK_SECRET
        sync: false
      - key: KUDA_ENABLED
        sync: false
      - key: KUDA_SANDBOX
        sync: false
      - key: KUDA_AUTO_SANDBOX_SETTLE
        sync: false
      - key: KUDA_OFFLINE_SANDBOX_SETTLE
        sync: false
      - key: KUDA_EMAIL
        sync: false
      - key: KUDA_API_KEY
        sync: false
      - key: KUDA_BASE_URL
        sync: false
      - key: KUDA_SENDER_NAME
        sync: false
      - key: KUDA_WEBHOOK_USERNAME
        sync: false
      - key: KUDA_WEBHOOK_PASSWORD
        sync: false
      - key: KUDA_WEBHOOK_SECRET
        sync: false
      - key: KUDA_WEBHOOK_SIGNATURE_HEADER
        sync: false
      # SMS — enable exactly one of Telnyx / Twilio / BulkSMS for phone OTP + pool alerts
      - key: TELNYX_ENABLED
        sync: false
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_API_URL
        sync: false
      - key: TELNYX_MESSAGING_PROFILE_ID
        sync: false
      - key: TELNYX_FROM_NUMBER
        sync: false
      - key: TWILIO_ENABLED
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: BULKSMS_ENABLED
        sync: false
      - key: BULKSMS_TOKEN_ID
        sync: false
      - key: BULKSMS_TOKEN_SECRET
        sync: false
      - key: BULKSMS_SENDER
        sync: false
      - key: PUBLIC_API_BASE_URL
        sync: false

  - type: web
    name: palpeer-admin
    runtime: static
    rootDir: palpeer-admin-end
    buildCommand: npm ci && node scripts/render-env.mjs && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PALPEER_API_ORIGIN
        fromService:
          type: web
          name: palpeer-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
